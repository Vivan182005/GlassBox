services:
  # 1. Node.js gateway: streams /api/* to the ML service
  - type: web
    name: glassbox-gateway
    env: node
    region: singapore
    rootDir: gateway
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ML_SERVICE_URL
        value: https://glassbox-ml-service.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false

  # 2. Python FastAPI ML service
  - type: web
    name: glassbox-ml-service
    env: python
    region: singapore
    rootDir: ml-service
    # Tectonic (LaTeX) lets the server compile tailored resumes in the candidate's own style
    buildCommand: pip install -r requirements.txt && bash bin/install_tectonic.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY        # JSearch: LinkedIn, Naukri, Indeed, Glassdoor listings
        sync: false
      - key: ADZUNA_APP_ID       # Adzuna India job boards
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
